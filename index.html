
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <title>Domain Checker</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Domain<span>Checker</span></h1>
    <p class="subtitle">Check domain registration instantly.</p>

    <section class="search-box">
      <label for="domain">Domain name</label>
      <input id="domain" placeholder="google" autocomplete="off"
        autocapitalize="off" spellcheck="false">

      <label for="extension">Domain extension</label>
      <input id="extension" placeholder=".com" autocomplete="off"
        autocapitalize="off" spellcheck="false">

      <div id="status" class="status" aria-live="polite">
        Enter a domain to start checking.
      </div>
    </section>

    <p class="note">
      Results are indicative. Confirm availability with a domain registrar.
    </p>
  </main>
</body>
</html>
