<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Check domain registration status.">
  <title>Domain Checker</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Domain<span>Checker</span></h1>
    <p class="subtitle">Check domain registration status.</p>

    <section class="search-box" aria-label="Domain checker">
      <label for="domain">Domain name</label>
      <input id="domain" placeholder="google" autocomplete="off"
        autocapitalize="off" spellcheck="false" inputmode="url">

      <label for="extension">Domain extension</label>
      <input id="extension" placeholder=".com" autocomplete="off"
        autocapitalize="off" spellcheck="false" inputmode="url">

      <div id="status" class="status muted" role="status" aria-live="polite">
        Enter a domain name and extension to start checking.
      </div>
    </section>

    <p class="note">
      Results are indicative. A missing RDAP or DNS record does not prove that a domain is available.
      Confirm availability with an accredited domain registrar.
    </p>
  </main>
</body>
</html>
